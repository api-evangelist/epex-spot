specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: EPEX SPOT
providerId: epex-spot
created: '2026-07-11'
modified: '2026-07-11'
reconciled: true
tags:
- Day-Ahead Prices
- Electricity
- Energy Markets
- Power Exchange
- Market Data
- Plans
description: >-
  EPEX SPOT market data is sold as monthly subscriptions through the EEX Group
  Webshop, invoiced yearly. Two delivery families exist. File packages deliver
  end-of-day (EOD) or historical (up to year-1) auction and continuous-market
  data as CSV/Excel over SFTP or webshare for twelve market areas. Read-only
  APIs deliver day-ahead and pan-EU intraday auction results, or all trades and
  orders on the continuous market, in real time. Webshop prices cover internal
  usage within a single legal entity only; external usage (display on a
  website, indexation, redistribution, marketing use) is quoted individually
  by the market data team. Trading access (MATS and M7 APIs) is not a market
  data product - it comes with exchange membership and is priced under
  membership and transaction fee schedules, not listed here.
notes: >-
  Prices captured from the EEX Group Webshop on 2026-07-11, displayed per
  month and invoiced on a yearly basis. Confirm current prices in the webshop
  before purchase; external-usage pricing requires a quote from
  marketdata.sales@epexspot.com.
sources:
- https://webshop.eex-group.com/epex-spot-public-market-data
- https://www.epexspot.com/en/marketdataservices
