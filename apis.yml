- aid: epex-spot:epex-spot-mats-auction-trading-api
  name: EPEX SPOT MATS Auction Trading API
  tags:
  - Auctions
  - Trading
  - Order Management
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.epexspot.com/en/technology
  properties:
  - url: https://www.epexspot.com/en/technology
    type: Documentation
  - url: https://www.epexspot.com/sites/default/files/download_center_files/MATS%20API%20Introduction%20v1.0%20-%20Light%20Package.pdf
    type: APIReference
  description: Member trading API for the Multiple Auction Trading System
    (MATS), the platform that replaced the legacy ETS system for all EPEX SPOT
    auction markets. Supports submission of linear, block, scalable complex,
    and Future-To-Spot orders, plus market results retrieval over REST -
    market result reports (CSV), trade reports (XML), and aggregated and
    individual order results (JSON). Requires exchange membership; full
    specifications are distributed to members and ISVs, so endpoints are not
    modeled here (endpointsModeled).
- aid: epex-spot:epex-spot-m7-intraday-trading-api
  name: EPEX SPOT M7 Intraday Trading API
  tags:
  - Intraday Trading
  - AMQP
  - Algorithmic Trading
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.epexspot.com/en/technology
  properties:
  - url: https://www.epexspot.com/en/technology
    type: Documentation
  - url: https://www.epexspot.com/en/software-providers
    type: Partners
  description: Member trading API for the M7 trading system that runs all EPEX
    SPOT continuous intraday markets. Clients exchange standardized messages
    with M7 over an AMQP (Advanced Message Queuing Protocol) server - the
    interface behind the large majority of automated intraday order flow on
    the exchange and the integration point for the ISVs on the EPEX SPOT
    software provider list. Requires exchange membership; specifications are
    member-gated, so endpoints are not modeled here (endpointsModeled).
