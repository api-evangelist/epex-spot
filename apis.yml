name: EPEX SPOT
kind: company
description: EPEX SPOT SE, the European Power Exchange, operates the organised
  short-term electricity markets across thirteen European countries - day-ahead
  and intraday auctions on the MATS trading system and continuous intraday
  trading on the M7 trading system. Day-ahead prices set on EPEX SPOT are the
  reference for much of the European power sector. EPEX SPOT exposes real
  machine-readable interfaces, but none of them are open self-serve APIs -
  trading APIs (MATS, M7) require exchange membership, and read-only market
  data APIs and SFTP file feeds require a paid Market Data Services
  subscription ordered through the EEX Group Webshop.
